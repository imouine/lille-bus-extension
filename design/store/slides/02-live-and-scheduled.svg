    <g transform="translate(942 584)"><rect width="230" height="70" rx="18" fill="#0E2132" stroke="#64748B"/><circle cx="30" cy="35" r="9" fill="#8497AC"/><text x="52" y="31" fill="#EEF8FF" font-size="15" font-weight="700">50 et 80 min</text><text x="52" y="52" fill="#8FB7D2" font-size="12">Horaires prévus utiles</text></g>
