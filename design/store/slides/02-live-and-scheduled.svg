    <text x="70" y="230" fill="#EEF8FF" font-size="58" font-weight="700" letter-spacing="-1.5">Le direct passe</text><text x="70" y="295" fill="#EEF8FF" font-size="58" font-weight="700" letter-spacing="-1.5">toujours en premier.</text>
    <text x="70" y="362" fill="#B4C8D7" font-size="23">Dès qu’un bus est confirmé en temps réel,</text><text x="70" y="395" fill="#B4C8D7" font-size="23">les horaires théoriques dépassés disparaissent.</text>
    <g transform="translate(70 470)"><rect width="440" height="92" rx="20" fill="#0E2132" stroke="#2C5873"/><circle cx="42" cy="46" r="22" fill="#45C695" fill-opacity=".18"/><path d="M32 46l7 7 14-16" fill="none" stroke="#45C695" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="40" fill="#EEF8FF" font-size="17" font-weight="700">Pas de faux départ imminent</text><text x="82" y="64" fill="#8FB7D2" font-size="13">Seuls les passages encore crédibles sont conservés.</text></g>

    <g filter="url(#shadow)"><rect x="608" y="104" width="600" height="505" rx="32" fill="#0B1A28" stroke="#38A9F5" stroke-opacity=".42" stroke-width="2"/><image href="../assets/actual-passage-cards.png" x="633" y="132" width="550" height="448"/></g>
    <path d="M842 492C815 548 760 576 690 594" fill="none" stroke="#38A9F5" stroke-width="2" stroke-dasharray="6 7"/>
